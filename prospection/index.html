<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Carnet de Prospection — Rennes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1c2b2a;
    --paper:#f6f1e7;
    --paper-2:#efe7d6;
    --line:#d8cdb4;
    --brick:#b5482c;
    --brick-dark:#8f3620;
    --teal:#1f4a44;
    --teal-light:#e4ede9;
    --gold:#b78a2e;
    --green:#3f6b4a;
    --green-bg:#e5efe6;
    --amber:#a6741b;
    --amber-bg:#f5ecd8;
    --red:#a3392b;
    --red-bg:#f5e3df;
    --gray:#7a7368;
    --gray-bg:#eae4d6;
    --white:#fffdf8;
    --shadow: 0 1px 2px rgba(28,43,42,0.06), 0 4px 14px rgba(28,43,42,0.06);
    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14px;
    line-height:1.45;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,43,42,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }

  ::selection{ background: var(--brick); color:var(--white); }

  .app{ max-width:1400px; margin:0 auto; padding:28px 28px 80px; }

  /* ---------- HEADER ---------- */
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px; margin-bottom:22px; gap:20px; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--brick); font-weight:600;
  }
  .brand h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:34px; margin:0;
    letter-spacing:-0.01em; color:var(--ink);
  }
  .brand .sub{ color:var(--gray); font-size:13px; }
  .top-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:10px 16px; border-radius:8px; border:1.5px solid var(--ink);
    background:var(--white); color:var(--ink); cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--brick); border-color:var(--brick); color:var(--white); }
  .btn-primary:hover{ background:var(--brick-dark); border-color:var(--brick-dark); }
  .btn-ghost{ border-color:var(--line); color:var(--gray); background:transparent; }
  .btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }
  .btn-sm{ padding:6px 10px; font-size:12px; border-radius:6px; }
  .btn-icon{ padding:8px 10px; }

  /* ---------- DASHBOARD ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:22px;
  }
  .stat-card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; line-height:1; }
  .stat-card .lbl{ font-size:11.5px; color:var(--gray); margin-top:6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .stat-card.total{ border-color:var(--ink); }
  .stat-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; }
  .stat-card.st-prospecter::before{ background:var(--gray); }
  .stat-card.st-contacte::before{ background:var(--amber); }
  .stat-card.st-rdv::before{ background:var(--teal); }
  .stat-card.st-client::before{ background:var(--green); }
  .stat-card.st-non::before{ background:var(--red); }

  /* ---------- SECTOR TABS ---------- */
  .sectors{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px;
    padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .sector-tab{
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500;
    padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--white); color:var(--ink); cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .sector-tab .count{ opacity:.55; }
  .sector-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--white); }
  .sector-tab.add-sector{ border-style:dashed; color:var(--brick); border-color:var(--brick); }

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap input{
    width:100%; padding:10px 12px 10px 34px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--white); font-family:'Inter',sans-serif; font-size:13px; color:var(--ink);
  }
  .search-wrap input:focus{ outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45; }
  select.filter{
    padding:9px 12px; border-radius:8px; border:1.5px solid var(--line); background:var(--white);
    font-family:'Inter',sans-serif; font-size:13px; color:var(--ink); cursor:pointer;
  }
  select.filter:focus, .btn:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--teal); outline-offset:1px; }

  /* ---------- TABLE ---------- */
  .table-wrap{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    overflow:auto; box-shadow:var(--shadow);
  }
  table{ width:100%; border-collapse:collapse; min-width:1180px; }
  thead th{
    position:sticky; top:0; background:var(--teal); color:var(--white); z-index:2;
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    font-weight:600; padding:12px 12px; border-bottom:1px solid var(--teal);
    font-family:'IBM Plex Mono',monospace;
  }
  tbody tr{ border-bottom:1px solid var(--paper-2); }
  tbody tr:hover{ background:var(--teal-light); }
  tbody td{ padding:11px 12px; vertical-align:top; font-size:13px; }
  td.nom{ font-weight:600; min-width:190px; }
  td.nom .sub{ font-weight:400; color:var(--gray); font-size:11.5px; margin-top:2px; }
  td .muted{ color:var(--gray); }
  td.notes{ max-width:220px; color:var(--gray); font-size:12.5px; }
  td.adresse{ max-width:200px; }
  a.link{ color:var(--teal); text-decoration:none; border-bottom:1px dotted var(--teal); }
  a.link:hover{ color:var(--brick); border-color:var(--brick); }

  .badge-sector{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    padding:2px 8px; border-radius:20px; background:var(--gray-bg); color:var(--ink);
    border:1px solid var(--line);
  }

  select.statut-select{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; border-radius:20px;
    padding:5px 10px; border:1px solid transparent; cursor:pointer; appearance:none;
    -webkit-appearance:none; min-width:130px;
  }
  select.statut-select.st-prospecter{ background:var(--gray-bg); color:var(--gray); }
  select.statut-select.st-contacte{ background:var(--amber-bg); color:var(--amber); }
  select.statut-select.st-rdv{ background:var(--teal-light); color:var(--teal); }
  select.statut-select.st-relance{ background:#eee0f5; color:#6a3b8f; }
  select.statut-select.st-client{ background:var(--green-bg); color:var(--green); }
  select.statut-select.st-non{ background:var(--red-bg); color:var(--red); }

  .relance-date{ font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .relance-date.overdue{ color:var(--red); font-weight:700; }
  .relance-date.today{ color:var(--brick); font-weight:700; }
  .relance-date.empty{ color:var(--gray); opacity:.5; }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    border:none; background:transparent; cursor:pointer; padding:5px; border-radius:6px;
    color:var(--gray); display:flex;
  }
  .icon-btn:hover{ background:var(--paper-2); color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--red); }

  .empty-state{ text-align:center; padding:70px 20px; color:var(--gray); }
  .empty-state h3{ font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:6px; }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,43,42,0.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:14px; width:100%; max-width:560px;
    max-height:88vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3);
    border:1px solid var(--line);
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0;
    background:var(--paper); z-index:1;
  }
  .modal-head h2{ font-family:'Fraunces',serif; font-size:20px; margin:0; font-weight:600; }
  .modal-body{ padding:20px 22px 22px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full{ grid-column:1/-1; }
  label{ display:block; font-size:11.5px; font-weight:600; color:var(--gray); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  input[type=text], input[type=tel], input[type=email], input[type=date], input[type=month], input[type=number], textarea, select.form-input, select{
    width:100%; padding:9px 11px; border-radius:8px; border:1.5px solid var(--line);
    font-family:'Inter',sans-serif; font-size:13.5px; background:var(--white); color:var(--ink);
  }
  .modal-body > label{ margin-bottom:14px; }
  .modal-body > label input, .modal-body > label textarea, .modal-body > label select{ margin-top:5px; text-transform:none; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-row label{ margin-bottom:14px; }
  .form-row:has(label:nth-child(3)){ grid-template-columns:1fr 1fr 1fr; }
  label input, label select, label textarea{ font-weight:400; color:var(--ink); }
  textarea{ resize:vertical; min-height:64px; font-family:'Inter',sans-serif; }
  .field{ margin-bottom:0; }
  .modal-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--white); padding:11px 20px; border-radius:8px;
    font-size:13px; font-weight:500; opacity:0; transition:all .25s ease; z-index:100;
    box-shadow:var(--shadow);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .footer-note{ margin-top:26px; color:var(--gray); font-size:12px; text-align:center; }

  @media (max-width:900px){
    .stats{ grid-template-columns:repeat(2,1fr); }
    .form-grid{ grid-template-columns:1fr; }
    table{ min-width:900px; }
  }

  .skeleton{ padding:60px; text-align:center; color:var(--gray); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .datalist-hint{ font-size:11px; color:var(--gray); margin-top:4px; }

  /* ---------- MODE BAR ---------- */
  .modebar{ display:flex; gap:6px; margin-bottom:22px; background:var(--paper-2); padding:5px; border-radius:12px; border:1px solid var(--line); width:fit-content; max-width:100%; flex-wrap:wrap; }
  .mode-tab{ display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border:none; background:transparent; border-radius:8px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--gray); cursor:pointer; transition:all .15s; }
  .mode-tab:hover{ color:var(--ink); }
  .mode-tab.active{ background:var(--teal); color:var(--white); box-shadow:var(--shadow); }
  .mode-tab svg{ opacity:.85; }

  /* ---------- ALERT STRIP ---------- */
  .alert-strip{ display:flex; align-items:center; gap:8px; background:var(--red-bg); border:1px solid #e3b9b0; color:var(--brick-dark); padding:11px 16px; border-radius:10px; font-size:13px; margin-bottom:18px; }
  .alert-strip svg{ flex-shrink:0; }

  /* ---------- ZONE GRID ---------- */
  .zone-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .zone-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .zone-card:hover{ transform:translateY(-2px); box-shadow:0 6px 20px rgba(28,43,42,0.12); border-color:var(--teal); }
  .zone-card-head{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .zone-card-head svg{ color:var(--teal); flex-shrink:0; }
  .zone-card-head h3{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0; line-height:1.15; }
  .zone-card-stats{ display:flex; gap:18px; margin-bottom:14px; }
  .zone-card-stats > div{ display:flex; flex-direction:column; }
  .zc-num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--ink); line-height:1; }
  .zc-num.zc-hot{ color:var(--brick); }
  .zc-lbl{ font-size:11px; color:var(--gray); margin-top:3px; }
  .zone-card-foot{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:12px; }
  .zone-open{ font-size:12.5px; font-weight:600; color:var(--brick); }

  /* ---------- IMMO GRID ---------- */
  .immo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:16px; }
  .immo-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .12s, box-shadow .12s; }
  .immo-card:hover{ transform:translateY(-2px); box-shadow:0 6px 20px rgba(28,43,42,0.1); }
  .immo-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .immo-card-head h3{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:2px 0 3px; line-height:1.15; }
  .immo-sec{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--brick); font-weight:600; }
  .immo-addr{ font-size:12.5px; color:var(--gray); }
  .immo-card-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip{ font-size:11px; padding:3px 9px; border-radius:20px; background:var(--gray-bg); color:var(--ink); font-weight:500; font-family:'IBM Plex Mono',monospace; }
  .chip-ent{ background:var(--teal-light); color:var(--teal); }
  .chip-hot{ background:var(--red-bg); color:var(--brick-dark); font-weight:600; }
  .score-hot{ background:#e9f2ea; color:var(--green); font-weight:700; }
  .score-mid{ background:var(--amber-bg); color:var(--amber); font-weight:700; }
  .score-low{ background:var(--gray-bg); color:var(--gray); }

  /* ---------- DETAIL ---------- */
  .detail-grid{ display:grid; grid-template-columns:300px 1fr; gap:20px; align-items:start; }
  .detail-card, .detail-main{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); }
  .detail-card h4, .detail-main h4, .dash-card h4{ font-family:'Fraunces',serif; font-size:15px; font-weight:600; margin:0 0 14px; display:flex; align-items:center; gap:7px; }
  dl.fiche{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:7px 12px; font-size:13px; }
  dl.fiche dt{ color:var(--gray); font-weight:500; }
  dl.fiche dd{ margin:0; font-weight:500; text-align:right; }
  .fiche-comment{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink); line-height:1.5; }
  .ent-list{ display:flex; flex-direction:column; gap:10px; }
  .ent-row{ display:flex; justify-content:space-between; gap:14px; padding:13px 14px; border:1px solid var(--line); border-radius:9px; background:var(--paper); }
  .ent-nom{ font-weight:600; font-size:14.5px; }
  .ent-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .ent-contact{ font-size:12px; color:var(--gray); margin-top:6px; font-family:'IBM Plex Mono',monospace; }
  .ent-side{ display:flex; flex-direction:column; align-items:flex-end; gap:7px; flex-shrink:0; }
  .bail-badge{ font-size:11px; padding:3px 9px; border-radius:6px; font-family:'IBM Plex Mono',monospace; background:var(--gray-bg); color:var(--gray); white-space:nowrap; }
  .bail-hot{ background:var(--red-bg); color:var(--brick-dark); font-weight:600; }
  .bail-ok{ background:var(--green-bg); color:var(--green); }
  .bail-past{ background:var(--gray-bg); color:var(--gray); text-decoration:line-through; }
  .score-badge{ font-size:15px; font-weight:700; padding:2px 10px; border-radius:7px; font-family:'IBM Plex Mono',monospace; }
  .score-badge .score-max{ font-size:10px; opacity:.6; }

  /* ---------- SCORE BOX (modal) ---------- */
  .score-box{ background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-top:4px; }
  .score-title{ font-size:12px; font-weight:600; color:var(--teal); margin-bottom:9px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em; }
  .score-flags{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .score-flag{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; cursor:pointer; }
  .score-flag .pts{ margin-left:auto; color:var(--green); font-weight:700; font-size:11px; font-family:'IBM Plex Mono',monospace; }
  .score-flag input{ width:auto; margin:0; }

  /* ---------- DASHBOARD ---------- */
  .dash-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  /* ---------- DIFFUSION ---------- */
  .diff-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .seg{ display:flex; gap:4px; background:var(--paper-2); padding:4px; border-radius:9px; border:1px solid var(--line); }
  .seg-btn{ flex:1; border:none; background:transparent; padding:8px 10px; border-radius:6px; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--gray); cursor:pointer; }
  .seg-btn.active{ background:var(--teal); color:var(--white); }
  .metier-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .mchip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink); background:var(--gray-bg); border:1px solid var(--line); padding:5px 10px; border-radius:20px; cursor:pointer; margin:0; }
  .mchip.on{ background:var(--teal-light); border-color:var(--teal); color:var(--teal); }
  .mchip input{ width:auto; margin:0; }
  .chk-line{ display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink); font-size:13px; margin:0; }
  .chk-line input{ width:auto; margin:0; }
  .dest-list{ margin-top:12px; max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .dest-row{ display:flex; justify-content:space-between; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); }
  .dest-nom{ font-weight:600; font-size:13px; }
  .dest-org{ font-size:11px; color:var(--gray); }
  .dest-mail{ font-size:12px; font-family:'IBM Plex Mono',monospace; color:var(--teal); align-self:center; word-break:break-all; }
  .msg-area{ width:100%; font-family:'Inter',sans-serif; font-size:13px; line-height:1.5; }
  .diff-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .diff-hint{ font-size:11.5px; color:var(--gray); margin-top:10px; line-height:1.5; }
  @media(max-width:900px){ .diff-grid{ grid-template-columns:1fr; } }
  /* ---------- ADRESSES ---------- */
  .adr-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .adr-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .adr-card-head{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .adr-addr{ font-size:12px; color:var(--gray); font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; gap:5px; }
  .adr-addr svg{ flex-shrink:0; }
  .adr-card-head h3{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin:6px 0 2px; }
  .adr-sec{ font-size:11px; color:var(--brick); font-weight:600; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em; }
  .adr-noact{ font-size:13px; color:var(--gray); font-style:italic; margin-top:6px; }

/* =========================================================================
   CONFIGURATION — À REMPLIR POUR ACTIVER LA SYNCHRO EN LIGNE (SUPABASE)
   Laisse les deux champs vides pour utiliser le stockage local du navigateur.
   Remplace par tes valeurs Supabase (Project URL + clé "anon public").
   ========================================================================= */
const SUPABASE_URL = "";      // ex : "https://xxxxxxxx.supabase.co"
const SUPABASE_ANON_KEY = ""; // ex : "eyJhbGciOiJI..."
const CARNET_ID = "rennes";   // identifiant du carnet (permet d'en gérer plusieurs)

/* ============ AGENT IA — configuration ============
   La clé API n'est JAMAIS écrite dans ce fichier : elle est saisie une fois par
   l'utilisateur via le bouton « Réglages » de l'onglet Agent IA, puis stockée
   uniquement dans le navigateur (localStorage). Sans clé, l'agent fonctionne
   quand même grâce à un moteur d'extraction par mots-clés (hors-ligne). */
const AI_KEY_STORAGE = 'agentia_api_key';
const AI_MODEL_STORAGE = 'agentia_model';
const AI_DEFAULT_MODEL = 'claude-sonnet-5';
function getAiKey(){ try{ return localStorage.getItem(AI_KEY_STORAGE) || ''; }catch(e){ return ''; } }
function getAiModel(){ try{ return localStorage.getItem(AI_MODEL_STORAGE) || AI_DEFAULT_MODEL; }catch(e){ return AI_DEFAULT_MODEL; } }
function setAiSettings(key, model){
  try{
    if(key===null){ localStorage.removeItem(AI_KEY_STORAGE); } else { localStorage.setItem(AI_KEY_STORAGE, key); }
    localStorage.setItem(AI_MODEL_STORAGE, model || AI_DEFAULT_MODEL);
  }catch(e){}
}

/* ============ COUCHE DE STOCKAGE (Supabase → sinon localStorage) ============ */
const DB = (function(){
  const useSupabase = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  const headers = () => ({
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer '+SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates,return=minimal'
  });
  // Table Supabase "carnet_kv" : colonnes (carnet text, k text, v jsonb, updated_at timestamptz) — clé primaire (carnet,k)
  async function sbGet(key){
    const url = `${SUPABASE_URL}/rest/v1/carnet_kv?carnet=eq.${encodeURIComponent(CARNET_ID)}&k=eq.${encodeURIComponent(key)}&select=v`;
    const r = await fetch(url, { headers: headers() });
    if(!r.ok) throw new Error('Supabase get '+r.status);
    const rows = await r.json();
    return (rows && rows.length) ? { value: JSON.stringify(rows[0].v) } : null;
  }
  async function sbSet(key, valueStr){
    const url = `${SUPABASE_URL}/rest/v1/carnet_kv`;
    const body = [{ carnet: CARNET_ID, k: key, v: JSON.parse(valueStr), updated_at: new Date().toISOString() }];
    const r = await fetch(url, { method:'POST', headers: headers(), body: JSON.stringify(body) });
    if(!r.ok) throw new Error('Supabase set '+r.status);
    return { value: valueStr };
  }
  // Fallback navigateur (par appareil)
  function lsGet(key){ const v = localStorage.getItem(CARNET_ID+':'+key); return v!==null ? { value:v } : null; }
  function lsSet(key, valueStr){ localStorage.setItem(CARNET_ID+':'+key, valueStr); return { value:valueStr }; }

  return {
    online: useSupabase,
    async get(key){
      if(useSupabase){ try{ return await sbGet(key); }catch(e){ console.warn('Supabase get KO, fallback local', e); return lsGet(key); } }
      return lsGet(key);
    },
    async set(key, valueStr){
      if(useSupabase){ try{ return await sbSet(key, valueStr); }catch(e){ console.warn('Supabase set KO, fallback local', e); return lsSet(key, valueStr); } }
      return lsSet(key, valueStr);
    }
  };
})();

/* ============ STORAGE ============ */
async function loadState(){
  let existing = [];
  try{
    const res = await DB.get('prospection_contacts');
    if(res && res.value){ existing = JSON.parse(res.value); }
  }catch(e){ existing = []; }

  const norm = s => (s||"").toLowerCase().trim().replace(/\s+/g,' ');
  const existingKeys = new Set(existing.map(c => norm(c.nom)+'|'+norm(c.adresse)));
  const statutFromLabel = (v) => { if(!v) return 'prospecter'; const m = STATUTS.find(s=>s.key===v||s.label===v); return m?m.key:'prospecter'; };
  const fresh = SEED_RAW.filter(d => !existingKeys.has(norm(d.nom)+'|'+norm(d.adresse)))
    .map(d => ({
      id: uid(), nom: d.nom, secteur: d.secteur, adresse: d.adresse, telephone: d.telephone||"",
      email: d.email||"", site: d.site||"", statut: statutFromLabel(d.statut), dateContact:d.dateContact||"", relance:d.relance||"",
      notes: d.notes||"", createdAt: Date.now()
    }));

  STATE.contacts = existing.concat(fresh);
  if(fresh.length>0 || existing.length===0){
    try{ await saveContacts(); }catch(e){}
  }

  try{
    const res2 = await DB.get('prospection_sectors');
    let storedSectors = (res2 && res2.value) ? JSON.parse(res2.value) : [];
    const mergedSectors = Array.from(new Set([...DEFAULT_SECTORS, ...storedSectors, ...SEED_RAW.map(d=>d.secteur)]));
    STATE.sectorsList = mergedSectors;
    await saveSectors();
  }catch(e){ STATE.sectorsList = Array.from(new Set([...DEFAULT_SECTORS, ...SEED_RAW.map(d=>d.secteur)])); }

  // Immeubles (mode SIG immobilier) — jamais écrasés
  try{
    const res3 = await DB.get('prospection_immeubles');
    STATE.immeubles = (res3 && res3.value) ? JSON.parse(res3.value) : [];
  }catch(e){ STATE.immeubles = []; }

  // Migration : supprimer l'ancien immeuble monolithique "Centre d'affaires Espace Performance" s'il est vide
  const before = STATE.immeubles.length;
  STATE.immeubles = STATE.immeubles.filter(im => !(String(im.nom).startsWith("Centre d'affaires Espace Performance") && (!im.entreprises || im.entreprises.length===0)));
  let changed = STATE.immeubles.length !== before;

  // Backfill : chaque immeuble a une zone (par défaut = secteur)
  STATE.immeubles.forEach(im=>{ if(!im.zone){ im.zone = im.secteur || 'Autre'; changed = true; } });
  // Backfill : chaque entreprise a un statut de cycle de vie (par défaut = installée)
  STATE.immeubles.forEach(im=>{ (im.entreprises||[]).forEach(e=>{ if(!e.cycleVie){ e.cycleVie = 'installe'; changed = true; } }); });

  // Fusion du seed immeubles (par nom normalisé) — ajoute les nouveaux ET complète ceux déjà présents mais vides
  try{
    const normI = s => (s||"").toLowerCase().trim().replace(/\s+/g,' ');
    const byName = {};
    STATE.immeubles.forEach(im=> byName[normI(im.nom)] = im);
    (typeof IMMEUBLES_SEED!=='undefined'?IMMEUBLES_SEED:[]).forEach(seedIm=>{
      const key = normI(seedIm.nom);
      const existing = byName[key];
      if(!existing){
        STATE.immeubles.push({ id:uidI(), ...seedIm, entreprises:(seedIm.entreprises||[]).map(e=>({id:uidE(),...e})), createdAt:Date.now() });
        changed = true;
      } else {
        if((seedIm.entreprises||[]).length){
          if(!existing.entreprises) existing.entreprises = [];
          const normE = n => (n||"").toLowerCase().trim().replace(/\s+/g,' ');
          const haveE = new Set(existing.entreprises.map(e=>normE(e.nom)));
          seedIm.entreprises.forEach(e=>{ if(!haveE.has(normE(e.nom))){ existing.entreprises.push({id:uidE(),...e}); changed=true; } });
        }
        ['zone','adresse','lat','lng','etages','annee','surface','proprietaire','commentaires'].forEach(f=>{ if((existing[f]===undefined||existing[f]===''||existing[f]===null) && seedIm[f]){ existing[f]=seedIm[f]; changed=true; } });
      }
    });
    if(changed) await saveImmeubles();
  }catch(e){}

  // Historique des offres diffusées
  try{
    const res4 = await DB.get('prospection_offres');
    STATE.offresEnvoyees = (res4 && res4.value) ? JSON.parse(res4.value) : [];
  }catch(e){ STATE.offresEnvoyees = []; }

  // Adresses (annuaire géolocalisé) — jamais écrasées
  try{
    const res5 = await DB.get('prospection_adresses');
    STATE.adresses = (res5 && res5.value) ? JSON.parse(res5.value) : [];
  }catch(e){ STATE.adresses = []; }

  // Journal de l'agent IA (notes terrain traitées)
  try{
    const res6 = await DB.get('prospection_agentlog');
    STATE.agentLog = (res6 && res6.value) ? JSON.parse(res6.value) : [];
  }catch(e){ STATE.agentLog = []; }
}

function statutMeta(key){ return STATUTS.find(s=>s.key===key) || STATUTS[0]; }

function computeStats(list){
  const s = { total:list.length };
  STATUTS.forEach(st => s[st.key] = list.filter(c=>c.statut===st.key).length);
  return s;
}

function getFilteredContacts(){
  return STATE.contacts.filter(c=>{
    if(STATE.sector !== "Tous" && c.secteur !== STATE.sector) return false;
    if(STATE.statutFilter !== "Tous" && c.statut !== STATE.statutFilter) return false;
    if(STATE.search){
      const q = STATE.search.toLowerCase();
      const hay = (c.nom+" "+c.adresse+" "+c.notes+" "+c.secteur).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function sectorCounts(){
  const map = {};
  STATE.contacts.forEach(c => map[c.secteur] = (map[c.secteur]||0)+1);
  return map;
}

function relanceClass(dateStr){
  if(!dateStr) return "empty";
  const d = new Date(dateStr); const t = new Date(todayISO());
  if(d < t) return "overdue";
  if(dateStr === todayISO()) return "today";

/* Calcul fin de bail + alerte 18 mois */
function bailInfo(ent){
  // ent.bailDebut (YYYY-MM ou YYYY-MM-DD), ent.bailDuree (années)
  if(!ent.bailDebut || !ent.bailDuree) return { fin:null, label:"—", cls:"", moisRestants:null };
  const d = new Date(ent.bailDebut.length===7 ? ent.bailDebut+'-01' : ent.bailDebut);
  if(isNaN(d)) return { fin:null, label:"—", cls:"", moisRestants:null };
  const fin = new Date(d); fin.setFullYear(fin.getFullYear() + parseInt(ent.bailDuree,10));
  const now = new Date();
  const moisRestants = Math.round((fin - now) / (1000*60*60*24*30.44));
  const finLabel = fin.toLocaleDateString('fr-FR', { month:'short', year:'numeric' });
  let cls = "", label = "Échéance "+finLabel;
  if(moisRestants < 0){ cls="bail-past"; label="Bail échu ("+finLabel+")"; }
  else if(moisRestants <= 18){ cls="bail-hot"; label="⚠ Fenêtre active — "+finLabel+" ("+moisRestants+" mois)"; }
  else { cls="bail-ok"; label=finLabel+" ("+moisRestants+" mois)"; }
  return { fin, label, cls, moisRestants };
}

function scoreEntreprise(ent){
  const flags = ent.scoreFlags || {};
  let total = 0;
  SCORE_CRITERIA.forEach(c => { if(flags[c.key]) total += c.pts; });
  // bonus bail : si fenêtre active (<=18 mois et >=0), +20 déjà via bailAncien possible ; on ajoute un boost fenêtre
  const bi = bailInfo(ent);
  if(bi.moisRestants !== null && bi.moisRestants >= 0 && bi.moisRestants <= 18) total += 15;
  return Math.min(100, total);
}
function scoreClass(s){ if(s>=70) return "score-hot"; if(s>=40) return "score-mid"; return "score-low"; }

/* Regroupe les immeubles par zone */
function zonesSummary(){
  const map = {};
  STATE.immeubles.forEach(im=>{
    const z = zoneOf(im);

    map[z].batiments++;
    (im.entreprises||[]).forEach(e=>{
      map[z].entreprises++;
      const bi = bailInfo(e); if(bi.moisRestants!==null && bi.moisRestants>=0 && bi.moisRestants<=18) map[z].hot++;
      map[z].bestScore = Math.max(map[z].bestScore, scoreEntreprise(e));
    });
    if(im.lat) map[z].withPos++;
  });
  return Object.values(map).sort((a,b)=> b.entreprises - a.entreprises || b.batiments - a.batiments);
}

/* ---- Carte Leaflet ---- */
let RENNES_MAP = null;
let MAP_MARKERS = [];
const RENNES_CENTER = [48.1173, -1.6778];

function immeubleBestScore(im){
  return (im.entreprises||[]).reduce((m,e)=>Math.max(m,scoreEntreprise(e)),0);
}
function markerColor(im){
  if(im.mandat) return '#1f6feb';                 // bleu = mandat en cours
  const s = immeubleBestScore(im);
  if(s>=70) return '#3f6b4a';                      // vert
  if(s>=40) return '#a6741b';                      // ambre
  if((im.entreprises||[]).length>0) return '#a3392b'; // rouge (occupé, faible score)
  return '#7a7368';                                 // gris (non renseigné)
}

function initRennesMap(list){
  const el = document.getElementById('mapRennes');
  if(!el || typeof L === 'undefined'){
    if(el) el.innerHTML = '<div class="map-fallback">La carte n\'a pas pu se charger (connexion aux serveurs de cartographie bloquée dans cet environnement). La vue Liste reste pleinement fonctionnelle.</div>';
    return;
  }
  RENNES_MAP = L.map(el, { scrollWheelZoom:true }).setView(RENNES_CENTER, 13);

  const plan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19, attribution:'© OpenStreetMap'
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom:19, attribution:'© Esri'
  });
  (STATE.mapLayer==='satellite' ? sat : plan).addTo(RENNES_MAP);

  MAP_MARKERS = [];
  const positioned = list.filter(im=>im.lat && im.lng);
  positioned.forEach(im=>{
    const color = markerColor(im);
    const marker = L.circleMarker([im.lat, im.lng], {
      radius:9, fillColor:color, color:'#fff', weight:2, fillOpacity:0.9
    }).addTo(RENNES_MAP);
    const ents = (im.entreprises||[]).length;
    const sc = immeubleBestScore(im);
    marker.bindPopup(`<strong>${esc(im.nom)}</strong><br>${esc(zoneOf(im))}${im.adresse?'<br>'+esc(im.adresse):''}<br>${ents} entreprise(s)${sc>0?' · score '+sc:''}<br><a href="#" onclick="window.__openImmo('${im.id}');return false;">Ouvrir la fiche →</a>`);
    MAP_MARKERS.push(marker);
  });
  if(positioned.length){
    const grp = L.featureGroup(MAP_MARKERS);
    try{ RENNES_MAP.fitBounds(grp.getBounds().pad(0.25)); }catch(e){}
  }
  setTimeout(()=>{ if(RENNES_MAP) RENNES_MAP.invalidateSize(); }, 120);
}
window.__openImmo = (id)=>{ const im=STATE.immeubles.find(x=>x.id===id); if(im) STATE.openZone=zoneOf(im); STATE.openImmeubleId=id; STATE.immoDisplay="liste"; renderImmeubles(); };

/* Géocodage via Nominatim (OpenStreetMap) */
async function geocodeAdresse(q){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);
    const res = await fetch(url, { headers:{'Accept':'application/json'} });
    const data = await res.json();
    if(data && data.length){ return { lat:parseFloat(data[0].lat), lng:parseFloat(data[0].lon) }; }
  }catch(e){}
  return null;
}

        <div class="form-row">

          <label>Adresse<input type="text" id="fAdresse" value="${esc(im.adresse||'')}" placeholder="À compléter plus tard"></label>
        </div>
        <div class="form-row">
          <label>Étages<input type="text" id="fEtages" value="${esc(im.etages||'')}"></label>
          <label>Année<input type="text" id="fAnnee" value="${esc(im.annee||'')}"></label>
          <label>Surface totale (m²)<input type="text" id="fSurface" value="${esc(im.surface||'')}"></label>
        </div>
        <div class="form-row">
          <label>Propriétaire<input type="text" id="fProprio" value="${esc(im.proprietaire||'')}"></label>
          <label>Gestionnaire<input type="text" id="fGest" value="${esc(im.gestionnaire||'')}"></label>
        </div>
        <div class="form-row">
          <label>Parking<input type="text" id="fParking" value="${esc(im.parking||'')}" placeholder="Ex : 20 places sous-sol"></label>
          <label>Dernière visite<input type="date" id="fVisite" value="${esc(im.derniereVisite||'')}"></label>
        </div>
        <label>Notes terrain<textarea id="fComment" rows="3">${esc(im.commentaires||'')}</textarea></label>

        <div class="geo-box">
          <div class="geo-head">
            <span class="score-title" style="margin:0;">Position sur la carte</span>
            <label class="geo-mandat"><input type="checkbox" id="fMandat" ${im.mandat?'checked':''}> Mandat en cours (marqueur bleu)</label>
          </div>
          <div class="geo-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="btnGeocode">${iconPin()} Localiser depuis l'adresse</button>
            <span class="geo-status" id="geoStatus">${im.lat?('📍 '+im.lat.toFixed(5)+', '+im.lng.toFixed(5)):'Aucune position — clique sur la carte pour placer le point'}</span>
          </div>
          <div id="miniMap" class="mini-map"></div>
        </div>
      </div>
      <div class="modal-foot">
        ${!isNew?`<button class="btn btn-danger-ghost" id="mDelete">Supprimer l'immeuble</button>`:'<span></span>'}
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="mCancel">Annuler</button>
          <button class="btn btn-primary" id="mSave">${isNew?'Créer':'Enregistrer'}</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('#mClose').onclick = close;
  overlay.querySelector('#mCancel').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };

  // Mini-carte de positionnement
  let pos = (im.lat && im.lng) ? { lat:im.lat, lng:im.lng } : null;
  let miniMap = null, miniMarker = null;
  const statusEl = overlay.querySelector('#geoStatus');
  function setPos(p, recenter){
    pos = p;
    statusEl.textContent = '📍 '+p.lat.toFixed(5)+', '+p.lng.toFixed(5);
    if(miniMap){
      if(!miniMarker){ miniMarker = L.marker([p.lat,p.lng], {draggable:true}).addTo(miniMap);
        miniMarker.on('dragend', ()=>{ const ll=miniMarker.getLatLng(); pos={lat:ll.lat,lng:ll.lng}; statusEl.textContent='📍 '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5); });
      } else { miniMarker.setLatLng([p.lat,p.lng]); }
      if(recenter) miniMap.setView([p.lat,p.lng], 16);
    }
  }
  setTimeout(()=>{
    const mel = overlay.querySelector('#miniMap');
    if(mel && typeof L!=='undefined'){
      miniMap = L.map(mel, {scrollWheelZoom:true}).setView(pos?[pos.lat,pos.lng]:RENNES_CENTER, pos?16:12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(miniMap);
      if(pos) setPos(pos, true);
      miniMap.on('click', (e)=> setPos({lat:e.latlng.lat, lng:e.latlng.lng}, false));
      setTimeout(()=>miniMap.invalidateSize(), 100);
    } else if(mel){ mel.innerHTML='<div class="map-fallback">Carte indisponible ici — tu peux quand même saisir l\'adresse, la position sera calculée à l\'enregistrement.</div>'; }
  }, 80);

  overlay.querySelector('#btnGeocode').onclick = async ()=>{
    const adr = overlay.querySelector('#fAdresse').value.trim();
    const nom = overlay.querySelector('#fNom').value.trim();
    if(!adr && !nom){ showToast('Saisis d\'abord une adresse'); return; }
    statusEl.textContent='Recherche de l\'adresse…';
    const q = (adr?adr:nom)+', Rennes, France';
    const r = await geocodeAdresse(q);
    if(r){ setPos(r, true); showToast('Adresse localisée'); }
    else { statusEl.textContent='Adresse introuvable — place le point à la main sur la carte'; }
  };

  if(!isNew){ overlay.querySelector('#mDelete').onclick = async ()=>{
    if(confirm('Supprimer cet immeuble et toutes ses entreprises ?')){
      STATE.immeubles = STATE.immeubles.filter(x=>x.id!==im.id);
      STATE.openImmeubleId=null; await saveImmeubles(); close(); renderImmeubles(); showToast('Immeuble supprimé');
    }
  };}
  overlay.querySelector('#mSave').onclick = async ()=>{
    const nom = overlay.querySelector('#fNom').value.trim();
    if(!nom){ showToast('Le nom est obligatoire'); return; }
    // si pas de position mais une adresse, tenter un géocodage silencieux
    if(!pos){
      const adr = overlay.querySelector('#fAdresse').value.trim();
      if(adr){ const r = await geocodeAdresse(adr+', Rennes, France'); if(r) pos=r; }
    }
    const zoneVal = overlay.querySelector('#fZone').value.trim() || 'Autre';
    const data = {
      nom, zone: zoneVal, secteur: zoneVal,
      adresse: overlay.querySelector('#fAdresse').value.trim(),
      etages: overlay.querySelector('#fEtages').value.trim(),
      annee: overlay.querySelector('#fAnnee').value.trim(),
      surface: overlay.querySelector('#fSurface').value.trim(),
      proprietaire: overlay.querySelector('#fProprio').value.trim(),
      gestionnaire: overlay.querySelector('#fGest').value.trim(),
      parking: overlay.querySelector('#fParking').value.trim(),
      derniereVisite: overlay.querySelector('#fVisite').value,
      commentaires: overlay.querySelector('#fComment').value.trim(),
      mandat: overlay.querySelector('#fMandat').checked,
      lat: pos?pos.lat:(im.lat||null), lng: pos?pos.lng:(im.lng||null),
    };
    if(isNew){ STATE.immeubles.push({ id:uidI(), ...data, entreprises:[], createdAt:Date.now() }); showToast('Immeuble créé'); }
    else { Object.assign(im, data); showToast('Fiche mise à jour'); }
    await saveImmeubles(); close(); renderImmeubles();
  };
}

function exportImmoCSV(){
  const headers = ['Zone','Bâtiment','Adresse','Propriétaire','Entreprise','Activité','Surface m²','Effectif','Décideur','Téléphone','Email','Site','Début bail','Durée bail','Fin de bail','Mois restants','Score'];
  const lines = [headers.join(';')];
  STATE.immeubles.forEach(im=>{
    const ents = im.entreprises||[];
    if(ents.length===0){
      lines.push([zoneOf(im),im.nom,im.adresse,im.proprietaire,'','','','','','','','','','','','',''].map(csvCell).join(';'));
    }
    ents.forEach(e=>{
      const bi = bailInfo(e);
      lines.push([zoneOf(im),im.nom,im.adresse,im.proprietaire,e.nom,e.activite,e.surface,e.effectif,e.decideur,e.telephone,e.email,e.site,e.bailDebut,e.bailDuree, bi.fin?bi.fin.toLocaleDateString('fr-FR'):'', bi.moisRestants!==null?bi.moisRestants:'', scoreEntreprise(e)].map(csvCell).join(';'));
    });
  });
  downloadCSV(lines.join('\n'), `immeubles_rennes_${todayISO()}.csv`);
  showToast('Export immeubles téléchargé');
}
function csvCell(v){ return `"${(v||'').toString().replace(/"/g,'""')}"`; }
function downloadCSV(content, filename){
  const blob = new Blob(["\uFEFF"+content], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}

let ADR_MAP=null;
function initAdrMap(list){
  const el=document.getElementById('mapAdr');
  if(!el||typeof L==='undefined'){ if(el) el.innerHTML='<div class="map-fallback">Carte indisponible ici. La vue Liste reste pleinement fonctionnelle.</div>'; return; }
  ADR_MAP=L.map(el,{scrollWheelZoom:true}).setView([48.1173,-1.6778],13);
  const plan=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
  (STATE.adrMapLayer==='satellite'?sat:plan).addTo(ADR_MAP);
  const markers=[];
  list.forEach(a=>{
    const m=L.circleMarker([a.lat,a.lng],{radius:9,fillColor:adrStatutColor(a),color:'#fff',weight:2,fillOpacity:0.9}).addTo(ADR_MAP);
    m.bindPopup(`<strong>${esc(a.activite||a.adresse)}</strong>${a.secteur?'<br>'+esc(a.secteur):''}<br>${esc(a.adresse)}${a.site?'<br><a href="'+esc(a.site)+'" target="_blank">site</a>':''}${a.linkedin?' · <a href="'+esc(a.linkedin)+'" target="_blank">LinkedIn</a>':''}<br><a href="#" onclick="window.__editAdr('${a.id}');return false;">Modifier →</a>`);
    markers.push(m);
  });
  if(markers.length){ try{ ADR_MAP.fitBounds(L.featureGroup(markers).getBounds().pad(0.25)); }catch(e){} }
  setTimeout(()=>{ if(ADR_MAP) ADR_MAP.invalidateSize(); },120);
}
window.__editAdr=(id)=>{ const a=STATE.adresses.find(x=>x.id===id); if(a) openAdresseModal(a); };

async function geocodeAdr(q){
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    const d=await r.json(); if(d&&d.length) return {lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
  }catch(e){}
  return null;
}

function exportAdrCSV(){
  const h=['Adresse','Activité pro','Activité','Secteur','Téléphone','Email','Site','Dirigeant','LinkedIn','Statut','Notes'];
  const lines=[h.join(';')];
  STATE.adresses.forEach(a=>{
    const st=STATUTS.find(s=>s.key===(a.statut||''))||{label:''};
    lines.push([a.adresse, a.activitePro===false?'Non':'Oui', a.activite, a.secteur, a.telephone, a.email, a.site, a.dirigeant, a.linkedin, st.label, a.notes].map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(';'));
  });
  const blob=new Blob(["\uFEFF"+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const el=document.createElement('a'); el.href=url; el.download='adresses_rennes_'+todayISO()+'.csv';
  document.body.appendChild(el); el.click(); el.remove(); showToast('Export adresses téléchargé');
}

/* ============ DIFFUSION D'OFFRE ============ */
function diffNorm(s){ return (s||'').toLowerCase().trim().replace(/\s+/g,' '); }

function diffCibles(){
  const d = STATE.diff;
  let items = [];
  if(d.cibleType === 'metier'){
    const sel = d.metiers.length ? d.metiers : [];
    STATE.contacts.forEach(c=>{
      if(sel.length===0 || sel.includes(c.secteur)){
        items.push({ nom:c.nom, org:c.secteur, email:c.email||'', tel:c.telephone||'', key:'c:'+diffNorm(c.nom)+'|'+diffNorm(c.adresse) });
      }
    });
  } else if(d.cibleType === 'zone'){
    STATE.immeubles.filter(im=> !d.zone || zoneOf(im)===d.zone).forEach(im=>{
      (im.entreprises||[]).forEach(e=>{
        items.push({ nom:e.nom, org:im.nom+' · '+zoneOf(im), email:e.email||'', tel:e.telephone||'', key:'e:'+im.id+':'+diffNorm(e.nom) });
      });
    });
  } else if(d.cibleType === 'immeuble'){
    const im = STATE.immeubles.find(x=>x.id===d.immeubleId);
    if(im) (im.entreprises||[]).forEach(e=>{
      items.push({ nom:e.nom, org:im.nom, email:e.email||'', tel:e.telephone||'', key:'e:'+im.id+':'+diffNorm(e.nom) });
    });
  }
  if(d.onlyWithEmail) items = items.filter(x=>x.email && x.email.includes('@'));
  return items;
}

function offreTexte(){
  const d = STATE.diff;
  const L = [];
  L.push("Bonjour,");
  L.push("");
  let intro = "Je me permets de vous présenter une offre immobilière";
  if(d.secteurBien) intro += " sur le secteur de "+d.secteurBien;
  intro += " qui pourrait vous intéresser :";
  L.push(intro);
  L.push("");
  if(d.bien) L.push("• Type de bien : "+d.bien);
  if(d.surface) L.push("• Surface : "+d.surface+" m²");
  if(d.prix) L.push("• "+d.prix);
  if(d.dispo) L.push("• Disponibilité : "+d.dispo);
  if(d.desc){ L.push(""); L.push(d.desc); }
  L.push("");
  L.push("Je reste à votre disposition pour toute information complémentaire ou une visite.");
  L.push("");
  L.push("Bien cordialement,");
  return L.join("\n");
}

/* ============ EXPORT ============ */
function exportCSV(){
  const rows = getFilteredContacts();
  const headers = ['Nom','Secteur','Adresse','Téléphone','Email','Statut','Dernier contact','Relance','Notes'];
  const lines = [headers.join(';')];
  rows.forEach(c=>{
    const line = [c.nom, c.secteur, c.adresse, c.telephone, c.email, statutMeta(c.statut).label, c.dateContact, c.relance, (c.notes||'').replace(/\n/g,' ')]
      .map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(';');
    lines.push(line);
  });
  const blob = new Blob(["\uFEFF"+lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `prospection_rennes_${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  showToast('Export CSV téléchargé');
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* =========================================================================
   AGENT IA — liaison terrain ↔ données
   Une note terrain en langage libre est analysée pour proposer une mise à
   jour de fiche (contact ou entreprise). Rien n'est jamais écrit sans
   validation humaine. Fonctionne hors-ligne par mots-clés ; devient plus
   fin si une clé API Claude est renseignée dans Réglages (stockée en local).
   ========================================================================= */

function normText(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const STOP_TOKENS = new Set(['le','la','les','de','des','du','et','sarl','sas','sasu','eurl','cabinet','societe','agence','sci','groupe','group',
  ...DEFAULT_SECTORS.flatMap(s=>normText(s).split(' ')).filter(t=>t.length>=3)]);

function buildEntityIndex(){
  const list = [];
  STATE.contacts.forEach(c=> list.push({ type:'contact', id:c.id, label:c.nom }));
  STATE.immeubles.forEach(im=> (im.entreprises||[]).forEach(e=> list.push({ type:'entreprise', id:e.id, immeubleId:im.id, label:e.nom, im })));
  return list;
}

function matchEntities(text){
  const norm = normText(text);
  if(!norm) return [];
  const noteWords = new Set(norm.split(' '));
  const scored = buildEntityIndex().map(ent=>{
    const nlabel = normText(ent.label);
    if(!nlabel) return { ...ent, score:0 };
    // correspondance mot à mot uniquement (évite qu'un fragment comme "sit" matche dans "visite")
    if(new RegExp('(^|\\s)'+nlabel+'(\\s|$)').test(norm)) return { ...ent, score:100 };
    const tokens = nlabel.split(' ').filter(t=>t.length>=3 && !STOP_TOKENS.has(t));
    if(!tokens.length) return { ...ent, score:0 };
    const matched = tokens.filter(t=>noteWords.has(t)).length;
    return { ...ent, score: matched ? Math.round((matched/tokens.length)*85) : 0 };
  }).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,8);
}

function parseDateFromText(text){
  const now = new Date();
  let m = text.match(/dans\s+(\d+)\s*(jours?|semaines?|mois)/i);
  if(m){
    const n = parseInt(m[1],10); const unit = m[2].toLowerCase();
    const d = new Date(now);
    if(unit.startsWith('jour')) d.setDate(d.getDate()+n);
    else if(unit.startsWith('semaine')) d.setDate(d.getDate()+n*7);
    else d.setMonth(d.getMonth()+n);
    return d.toISOString().slice(0,10);
  }
  m = text.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let dd=m[1], mm=m[2], yy=m[3]; if(yy.length===2) yy='20'+yy;
    const d = new Date(`${yy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  return null;
}

const RULES_CYCLE = [
  { key:'depart_confirme', re:/(depart(s)? confirm|resilient? (leur|le) bail|quittent definitivement|ont donne conge)/i },
  { key:'achat',           re:/(achetent? (leurs|ses) locaux|deviennent? proprietaires?|acquierent? (leurs|ses|le) (locaux|batiment))/i },
  { key:'negociation',     re:/(en negociation|negocient? (un nouveau bail|le renouvellement|leurs conditions))/i },
  { key:'recherche',       re:/(cherchent? (des|de) (nouveaux )?locaux|recherchent? des bureaux|en recherche de locaux|veulent? (demenager|partir|quitter))/i },
  { key:'signal',          re:/(envisagent? de (demenager|partir|quitter)|reflechissent a (demenager|partir)|pourraient? quitter|incertitude sur (leur|le) maintien|bail arrive a echeance)/i },
  { key:'libere',          re:/(locaux? (liberes?|vides?)|ont quitte|sont partis|ont demenage)/i },
];
const RULES_STATUT = [
  { key:'client',   re:/(signature|signe|nouveau partenaire|partenariat (conclu|signe)|devient client|devenue cliente)/i },
  { key:'non',      re:/(pas interesse|refuse|ne souhaite pas|decline)/i },
  { key:'rdv',      re:/(rendez-vous|rdv (pris|fixe)|rencontre)/i },
  { key:'relance',  re:/(a relancer|rappeler|recontacter|revenir vers (eux|lui|elle))/i },
  { key:'contacte', re:/(premier contact|appele (ce matin|aujourd hui)|contacte par (telephone|mail|email))/i },
];
const RULES_FLAGS = [
  { key:'recrutement',    re:/(recrutent?|embauchent?|offres? d emploi|campagne de recrutement)/i },
  { key:'levee',          re:/(levent? des fonds|levee de fonds|financement (obtenu|leve))/i },
  { key:'nouvelleAgence', re:/(nouvelle agence|ouvrent? une agence|nouvelle implantation|ouverture d un (site|bureau))/i },
  { key:'croissance',     re:/(forte croissance|en pleine croissance|croissance rapide|doublent (leurs effectifs|leur activite))/i },
  { key:'effectif100',    re:/(plus de 100 (salaries|employes|collaborateurs))/i },
];

function truncateLabel(s, n){ s=(s||'').trim(); return s.length>n ? s.slice(0,n)+'…' : s; }

function extractRulesBased(text, best){
  const norm = normText(text);
  const changes = [];
  if(best && best.type==='entreprise'){
    for(const r of RULES_CYCLE){ if(r.re.test(norm)){ changes.push({field:'cycleVie', appliesTo:['entreprise'], label:`Cycle de vie → ${cycleMeta(r.key).label}`, value:r.key}); break; } }
    for(const r of RULES_FLAGS){ if(r.re.test(norm)){ const meta=SCORE_CRITERIA.find(c=>c.key===r.key); changes.push({field:'flag:'+r.key, appliesTo:['entreprise'], label:`Signal : ${meta.label} (+${meta.pts})`, value:true}); } }
  } else if(best && best.type==='contact'){
    for(const r of RULES_STATUT){ if(r.re.test(norm)){ changes.push({field:'statut', appliesTo:['contact'], label:`Statut → ${statutMeta(r.key).label}`, value:r.key}); break; } }
    changes.push({field:'dateContact', appliesTo:['contact'], label:`Dernier contact → aujourd'hui (${todayISO()})`, value:todayISO()});
  }
  const dateFound = parseDateFromText(text);
  if(dateFound){ changes.push({field:'relance', appliesTo:['contact'], label:`Relance → ${dateFound}`, value:dateFound}); }
  changes.push({field:'note', appliesTo:['contact','entreprise'], label:`Ajouter à l'historique : « ${truncateLabel(text,90)} »`, value:`[${todayISO()}] ${text.trim()}`});
  return changes;
}

async function extractViaAI(text, candidates){
  const apiKey = getAiKey();
  const model = getAiModel();
  const entityList = candidates.slice(0,15).map(c=>`${c.id}::${c.type}::${c.label}`).join('\n') || '(aucune correspondance évidente trouvée par recherche de mots-clés)';
  const system = `Tu es l'assistant data d'un carnet de prospection immobilier tertiaire à Rennes. Tu reçois une note terrain écrite par un commercial et une liste d'entités connues (contacts prestataires ou entreprises occupant des bureaux). Réponds UNIQUEMENT avec un objet JSON strict, sans texte autour, au format :
{"matchId": string|null, "confidence": 0-100, "cycleVie": "installe|signal|recherche|negociation|achat|depart_confirme|libere"|null, "statutContact": "prospecter|contacte|rdv|relance|client|non"|null, "relanceDate": "YYYY-MM-DD"|null, "scoreFlags": {"recrutement":true,"levee":true,"nouvelleAgence":true,"croissance":true,"effectif100":true}, "resume": "phrase courte au passé résumant la note pour l'historique"}
"cycleVie" ne s'applique qu'aux entités de type entreprise (occupant de bureaux), "statutContact" uniquement aux contacts prestataires. Mets à null ce qui n'est pas mentionné. scoreFlags ne doit contenir que les clés vraies détectées (objet vide sinon). matchId doit être un des identifiants fournis, ou null si aucun ne correspond clairement au texte.`;
  const user = `NOTE TERRAIN :\n"""${text}"""\n\nENTITÉS CONNUES (id::type::nom) :\n${entityList}`;
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model, max_tokens:500, system, messages:[{role:'user', content:user}] })
  });
  if(!res.ok) throw new Error('Anthropic API '+res.status);
  const data = await res.json();
  const raw = (data.content && data.content[0] && data.content[0].text) || '';
  const jsonMatch = raw.match(/\{[\s\S]*\}/);
  if(!jsonMatch) throw new Error('Réponse IA non structurée');
  const parsed = JSON.parse(jsonMatch[0]);
  const matched = candidates.find(c=>c.id===parsed.matchId) || null;
  const changes = [];
  if(matched && matched.type==='entreprise' && parsed.cycleVie){
    changes.push({field:'cycleVie', appliesTo:['entreprise'], label:`Cycle de vie → ${cycleMeta(parsed.cycleVie).label}`, value:parsed.cycleVie});
  }
  if(matched && matched.type==='contact' && parsed.statutContact){
    changes.push({field:'statut', appliesTo:['contact'], label:`Statut → ${statutMeta(parsed.statutContact).label}`, value:parsed.statutContact});
    changes.push({field:'dateContact', appliesTo:['contact'], label:`Dernier contact → aujourd'hui (${todayISO()})`, value:todayISO()});
  }
  if(parsed.relanceDate){ changes.push({field:'relance', appliesTo:['contact'], label:`Relance → ${parsed.relanceDate}`, value:parsed.relanceDate}); }
  if(matched && matched.type==='entreprise' && parsed.scoreFlags){
    Object.keys(parsed.scoreFlags).forEach(k=>{
      const meta = SCORE_CRITERIA.find(c=>c.key===k);
      if(parsed.scoreFlags[k] && meta) changes.push({field:'flag:'+k, appliesTo:['entreprise'], label:`Signal : ${meta.label} (+${meta.pts})`, value:true});
    });
  }
  const resume = parsed.resume ? `[${todayISO()}] ${parsed.resume}` : `[${todayISO()}] ${text.trim()}`;
  changes.push({field:'note', appliesTo:['contact','entreprise'], label:`Ajouter à l'historique : « ${truncateLabel(resume,100)} »`, value:resume});
  return { matchId: parsed.matchId||null, confidence: parsed.confidence||0, changes };
}

async function runAgentAnalyze(text){
  text = (text||'').trim();
  if(!text){ showToast('Écris ou dicte une note avant d\'analyser.'); return; }
  const candidates = matchEntities(text);
  const best = candidates[0] || null;
  const apiKey = getAiKey();
  let changes, source, matchOverride = null;
  if(apiKey){
    try{
      const ai = await extractViaAI(text, candidates);
      source = 'ia'; changes = ai.changes;
      if(ai.matchId) matchOverride = candidates.find(c=>c.id===ai.matchId) || null;
    }catch(err){
      console.warn('IA indisponible, bascule sur les règles locales', err);
      showToast('IA indisponible — extraction par mots-clés utilisée');
      source = 'regles'; changes = extractRulesBased(text, best);
    }
  } else {
    source = 'regles'; changes = extractRulesBased(text, best);
  }
  const chosen = matchOverride || best;
  STATE.agentSuggestion = {
    id: uid(), rawText:text, ts:Date.now(), source,
    matchType: chosen ? chosen.type : null,
    matchId: chosen ? chosen.id : null,
    matchImmeubleId: chosen ? (chosen.immeubleId||null) : null,
    matchLabel: chosen ? chosen.label : null,
    confidence: chosen ? chosen.score : 0,
    alternatives: candidates,
    changes,
  };
  renderAgent();
}

function findMatchRecord(sug){
  if(sug.matchType==='contact') return STATE.contacts.find(c=>c.id===sug.matchId) || null;
  if(sug.matchType==='entreprise'){
    const im = STATE.immeubles.find(x=>x.id===sug.matchImmeubleId);
    return im ? ((im.entreprises||[]).find(e=>e.id===sug.matchId) || null) : null;
  }
  return null;
}

async function applyAgentSuggestion(){
  const sug = STATE.agentSuggestion;
  if(!sug) return;
  const record = findMatchRecord(sug);
  if(!record){ showToast('Choisis une fiche à mettre à jour avant d\'appliquer.'); return; }
  const applied = [];
  document.querySelectorAll('#suggestionChanges input[data-idx]').forEach(cb=>{
    if(!cb.checked) return;
    const ch = sug.changes[parseInt(cb.dataset.idx,10)];
    if(!ch || !ch.appliesTo.includes(sug.matchType)) return;
    if(ch.field==='note'){ record.notes = (record.notes ? record.notes+'\n' : '') + ch.value; }
    else if(ch.field.startsWith('flag:')){ const k=ch.field.slice(5); if(!record.scoreFlags) record.scoreFlags={}; record.scoreFlags[k]=true; }
    else { record[ch.field] = ch.value; }
    applied.push(ch.label);
  });
  if(sug.matchType==='contact') await saveContacts(); else await saveImmeubles();
  STATE.agentLog.unshift({ id:uid(), ts:Date.now(), rawText:sug.rawText, matchLabel:sug.matchLabel, matchType:sug.matchType, source:sug.source, outcome:'applied', applied });
  STATE.agentLog = STATE.agentLog.slice(0,200);
  await saveAgentLog();
  STATE.agentSuggestion = null;
  showToast('Fiche mise à jour depuis la note terrain');
  renderAgent();
}

function ignoreAgentSuggestion(){
  const sug = STATE.agentSuggestion;
  if(sug){
    STATE.agentLog.unshift({ id:uid(), ts:Date.now(), rawText:sug.rawText, matchLabel:sug.matchLabel, matchType:sug.matchType, source:sug.source, outcome:'ignored', applied:[] });
    STATE.agentLog = STATE.agentLog.slice(0,200);
    saveAgentLog();
  }
  STATE.agentSuggestion = null;
  renderAgent();
}

function onAgentMatchChange(val){
  const sug = STATE.agentSuggestion;
  if(!sug) return;
  if(!val){ sug.matchType=null; sug.matchId=null; sug.matchImmeubleId=null; sug.matchLabel=null; }
  else {
    const [type,id,immeubleId] = val.split('::');
    const alt = sug.alternatives.find(a=>a.type===type && a.id===id);
    sug.matchType = type; sug.matchId = id; sug.matchImmeubleId = immeubleId || null;
    sug.matchLabel = alt ? alt.label : '';
  }
  renderAgent();
}

/* ---- Assistant Q/R sur les données ---- */
function buildDataSnapshot(){
  const movers=[], bauxHot=[], topScores=[];
  STATE.immeubles.forEach(im=>(im.entreprises||[]).forEach(e=>{
    const bi=bailInfo(e); const sc=scoreEntreprise(e);
    const row = { entreprise:e.nom, immeuble:im.nom, zone:zoneOf(im), cycleVie:cycleMeta(e.cycleVie).label, activite:e.activite||'', effectif:e.effectif||'', bailFin: bi.fin ? bi.fin.toISOString().slice(0,7) : null, moisRestants: bi.moisRestants, score: sc };
    if((e.cycleVie||'installe')!=='installe') movers.push(row);
    if(bi.moisRestants!==null && bi.moisRestants>=0 && bi.moisRestants<=18) bauxHot.push(row);
    if(sc>0) topScores.push(row);
  }));
  topScores.sort((a,b)=>b.score-a.score);
  const relancesLate = STATE.contacts.filter(c=>c.relance && relanceClass(c.relance)==='overdue').map(c=>({nom:c.nom, secteur:c.secteur, relance:c.relance}));
  const relancesAvenir = STATE.contacts.filter(c=>c.relance && relanceClass(c.relance)!=='overdue').map(c=>({nom:c.nom, secteur:c.secteur, relance:c.relance})).slice(0,30);
  return { zones: zonesSummary(), entreprises_en_mouvement:movers.slice(0,60), baux_proches:bauxHot.slice(0,60), meilleurs_scores:topScores.slice(0,30), relances_en_retard:relancesLate.slice(0,40), relances_a_venir:relancesAvenir };
}

function localAssistantAnswer(q){
  const nq = normText(q);
  if(/\b(bail|baux|echeance|expir)/.test(nq)){
    const baux=[]; STATE.immeubles.forEach(im=>(im.entreprises||[]).forEach(e=>{ const bi=bailInfo(e); if(bi.moisRestants!==null && bi.moisRestants>=0 && bi.moisRestants<=18) baux.push({im,e,bi}); }));
    baux.sort((a,b)=>a.bi.moisRestants-b.bi.moisRestants);
    if(!baux.length) return "Aucun bail avec une échéance inférieure à 18 mois pour l'instant.";
    return "Baux en fenêtre de prospection (< 18 mois) :\n" + baux.map(b=>`• ${b.e.nom} — ${b.im.nom} (${zoneOf(b.im)}) — ${b.bi.moisRestants} mois restants`).join('\n');
  }
  if(/\b(retard|relance)/.test(nq)){
    const late = STATE.contacts.filter(c=>c.relance && relanceClass(c.relance)==='overdue');
    if(!late.length) return "Aucune relance en retard.";
    return "Relances en retard :\n" + late.map(c=>`• ${c.nom} (${c.secteur}) — relance prévue le ${c.relance}`).join('\n');
  }
  if(/\b(mouvement|demenage|partent|quittent|depart)/.test(nq)){
    const movers=[]; STATE.immeubles.forEach(im=>(im.entreprises||[]).forEach(e=>{ if((e.cycleVie||'installe')!=='installe') movers.push({im,e}); }));
    if(!movers.length) return "Aucune entreprise identifiée en mouvement pour l'instant.";
    return "Entreprises en mouvement :\n" + movers.map(m=>`• ${m.e.nom} — ${m.im.nom} — ${cycleMeta(m.e.cycleVie).label}`).join('\n');
  }
  if(/\b(score|prioritaire|chaud)/.test(nq)){
    const allEnt=[]; STATE.immeubles.forEach(im=>(im.entreprises||[]).forEach(e=>allEnt.push({im,e,score:scoreEntreprise(e)})));
    allEnt.sort((a,b)=>b.score-a.score);
    const top = allEnt.filter(x=>x.score>0).slice(0,8);
    if(!top.length) return "Aucun score calculé pour l'instant — renseigne les signaux d'opportunité des entreprises.";
    return "Prospects prioritaires :\n" + top.map(x=>`• ${x.e.nom} — ${x.im.nom} — score ${x.score}/100`).join('\n');
  }
  return "Sans clé API configurée, je peux répondre aux questions sur : les baux proches, les relances en retard, les entreprises en mouvement, et les meilleurs scores. Configure une clé Claude dans « Réglages » pour des réponses en langage libre.";
}

async function askAssistant(question){
  question = (question||'').trim();
  if(!question) return;
  STATE.agentAnswer = { q:question, loading:true, a:'' };
  renderAgent();
  const apiKey = getAiKey();
  if(!apiKey){ STATE.agentAnswer = { q:question, loading:false, a: localAssistantAnswer(question) }; renderAgent(); return; }
  try{
    const snapshot = buildDataSnapshot();
    const system = `Tu es l'assistant data d'un carnet de prospection immobilier tertiaire à Rennes (agence immobilière). Réponds en français, de façon concise et factuelle, en citant les noms d'entreprises/bâtiments pertinents, à partir UNIQUEMENT des données JSON fournies. Si l'information n'y figure pas, dis-le clairement.`;
    const user = `DONNÉES (JSON) :\n${JSON.stringify(snapshot)}\n\nQUESTION : ${question}`;
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:getAiModel(), max_tokens:700, system, messages:[{role:'user', content:user}] })
    });
    if(!res.ok) throw new Error('Anthropic API '+res.status);
    const data = await res.json();
    const text = (data.content && data.content[0] && data.content[0].text) || "Je n'ai pas pu générer de réponse.";
    STATE.agentAnswer = { q:question, loading:false, a:text };
  }catch(err){
    console.warn('IA indisponible pour la question, bascule locale', err);
    STATE.agentAnswer = { q:question, loading:false, a: localAssistantAnswer(question) + "\n\n(IA indisponible pour cette question — réponse locale.)" };
  }
  renderAgent();
}

let AGENT_RECOG = null;
function toggleDictation(btn){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(AGENT_RECOG){ AGENT_RECOG.stop(); AGENT_RECOG=null; btn.classList.remove('on'); return; }
  AGENT_RECOG = new SR();
  AGENT_RECOG.lang = 'fr-FR';
  AGENT_RECOG.interimResults = false;
  AGENT_RECOG.continuous = true;
  const ta = document.getElementById('agentNote');
  AGENT_RECOG.onresult = (ev)=>{
    let finalTxt='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){ if(ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript; }
    if(finalTxt && ta) ta.value = (ta.value ? ta.value+' ' : '') + finalTxt.trim();
  };
  AGENT_RECOG.onerror = ()=>{ btn.classList.remove('on'); AGENT_RECOG=null; };
  AGENT_RECOG.onend = ()=>{ btn.classList.remove('on'); AGENT_RECOG=null; };
  AGENT_RECOG.start();
  btn.classList.add('on');
}

function renderSuggestionBox(sug){
  const relevant = sug.changes.map((ch,idx)=>({ch,idx})).filter(x=> !sug.matchType || x.ch.appliesTo.includes(sug.matchType));
  const options = [`<option value="">— Aucune correspondance / juste archiver la note —</option>`]
    .concat(sug.alternatives.map(a=>`<option value="${a.type}::${a.id}::${a.immeubleId||''}" ${(a.type===sug.matchType && a.id===sug.matchId)?'selected':''}>${a.type==='entreprise'?'🏢':'👤'} ${esc(a.label)}${a.type==='entreprise' && a.im ? ' · '+esc(a.im.nom):''}</option>`));
  return `
  <div class="suggestion-box">
    <div class="sg-head">
      <div>
        <div class="sg-match">${sug.matchLabel ? (sug.matchType==='entreprise'?'🏢 ':'👤 ')+esc(sug.matchLabel) : 'Aucune fiche associée'}</div>
        <div class="sg-conf">${sug.source==='ia'?'Analysé par IA':'Analysé par mots-clés'}${sug.matchLabel?' · confiance '+sug.confidence+'%':''}</div>
      </div>
    </div>
    <div class="sg-alt">
      <label style="margin-bottom:4px;">Corriger la fiche associée</label>
      <select id="sgMatchSelect">${options.join('')}</select>
    </div>
    <div class="sg-changes" id="suggestionChanges">
      ${relevant.length ? relevant.map(x=>`<label class="sg-change"><input type="checkbox" data-idx="${x.idx}" checked> <span>${x.ch.label}</span></label>`).join('') : '<div class="muted small">Aucune modification structurée détectée — seule la note sera archivée dans le journal.</div>'}
    </div>
    <div class="agent-actions">
      <button class="btn btn-primary" id="btnApplySuggestion">${iconEdit()} Appliquer à la fiche</button>
      <button class="btn btn-ghost" id="btnIgnoreSuggestion">Ignorer</button>
    </div>
  </div>`;
}

function logItem(l){
  const d = new Date(l.ts);
  const dateStr = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return `
  <div class="log-item">
    <div class="log-head"><span>${l.matchLabel?esc(l.matchLabel):'Sans fiche associée'}</span><span class="log-date">${dateStr}</span></div>
    <div class="log-txt">${esc(l.rawText)}</div>
    <div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
      <span class="log-tag ${l.outcome==='applied'?'applied':'ignored'}">${l.outcome==='applied'?'Appliqué':'Ignoré'}</span>
      ${l.source?`<span class="muted" style="font-size:10.5px;">${l.source==='ia'?'IA':'règles'}</span>`:''}
    </div>
  </div>`;
}

function renderAgent(){
  const app = document.getElementById('app');
  const hasKey = !!getAiKey();
  const sug = STATE.agentSuggestion;
  const log = STATE.agentLog||[];
  const speechOk = ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);

  app.innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="eyebrow">Liaison terrain ↔ données</div>
        <h1>Agent IA</h1>
        <div class="sub">Note une visite ou un appel en langage libre — l'agent propose la mise à jour de la fiche correspondante.</div>
      </div>
      <div class="top-actions">
        <span class="agent-mode-pill ${hasKey?'agent-mode-ia':'agent-mode-regles'}">${hasKey?'● IA Claude active':'● Mode règles locales'}</span>
        <button class="btn btn-ghost btn-sm" id="btnAgentSettings">${iconGear()} Réglages</button>
      </div>
    </header>
    ${modeBar('agent')}

    <div class="agent-grid">
      <div>
        <div class="agent-card">
          <h4>Note terrain</h4>
          <div class="note-input-wrap">
            <textarea id="agentNote" rows="4" placeholder="Ex : Rendez-vous avec Dupont Avocats, ils cherchent 200m² secteur Beaulieu d'ici 6 mois, le bail actuel arrive à échéance…">${sug?esc(sug.rawText):''}</textarea>
            ${speechOk?`<button type="button" class="btn-mic" id="btnMic" title="Dicter la note">${iconMic()}</button>`:''}
          </div>
          <div class="agent-actions">
            <button class="btn btn-primary" id="btnAnalyze">${iconBot()} Analyser la note</button>
            <button class="btn btn-ghost" id="btnClearNote">Effacer</button>
          </div>
          ${sug ? renderSuggestionBox(sug) : ''}
        </div>

        <div class="agent-card" style="margin-top:18px;">
          <h4>Poser une question sur mes données</h4>
          <div class="form-row" style="grid-template-columns:1fr auto;">
            <input type="text" id="agentQuestion" placeholder="Ex : quelles entreprises du secteur Alma risquent de partir ?" value="${STATE.agentAnswer?esc(STATE.agentAnswer.q):''}">
            <button class="btn btn-primary" id="btnAsk" style="align-self:end;">Demander</button>
          </div>
          ${STATE.agentAnswer ? `<div class="ask-answer ${STATE.agentAnswer.loading?'loading':''}">${STATE.agentAnswer.loading?'Recherche en cours…':esc(STATE.agentAnswer.a)}</div>` : ''}
        </div>
      </div>

      <div class="agent-card">
        <h4>Journal de l'agent <span class="muted small">${log.length}</span></h4>
        ${log.length ? `<div class="agent-log">${log.map(logItem).join('')}</div>` : `<div class="muted small">Aucune note traitée pour l'instant. Le journal garde une trace de chaque note terrain analysée, appliquée ou ignorée.</div>`}
      </div>
    </div>

    <div class="footer-note">L'agent propose toujours une modification à valider — rien n'est écrit dans les fiches sans ta confirmation.</div>
  `;
  bindModeTabs();
  document.getElementById('btnAgentSettings').onclick = openAgentSettingsModal;
  document.getElementById('btnAnalyze').onclick = ()=> runAgentAnalyze(document.getElementById('agentNote').value);
  document.getElementById('btnClearNote').onclick = ()=>{ STATE.agentSuggestion=null; renderAgent(); };
  document.getElementById('btnAsk').onclick = ()=> askAssistant(document.getElementById('agentQuestion').value);
  document.getElementById('agentQuestion').addEventListener('keydown', (e)=>{ if(e.key==='Enter') askAssistant(e.target.value); });
  if(speechOk){ document.getElementById('btnMic').onclick = (e)=> toggleDictation(e.currentTarget); }
  if(sug){
    const sel = document.getElementById('sgMatchSelect');
    if(sel) sel.onchange = (e)=> onAgentMatchChange(e.target.value);
    const applyBtn = document.getElementById('btnApplySuggestion');
    if(applyBtn) applyBtn.onclick = applyAgentSuggestion;
    const ignoreBtn = document.getElementById('btnIgnoreSuggestion');
    if(ignoreBtn) ignoreBtn.onclick = ignoreAgentSuggestion;
  }
}

function iconBot(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><circle cx="8" cy="16" r="0.5"/><circle cx="16" cy="16" r="0.5"/></svg>`; }
function iconGear(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`; }
function iconMic(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`; }

/* ============ INIT ============ */
function syncBadge(){
  const b = document.createElement('div');
  b.id = 'syncBadge';
  b.className = 'sync-badge ' + (DB.online ? 'sync-on' : 'sync-off');
  b.innerHTML = DB.online
    ? '● Synchronisé en ligne'
    : '● Local (cet appareil)';
  b.title = DB.online
    ? 'Tes données sont enregistrées dans ta base Supabase et synchronisées sur tous tes appareils.'
    : 'Supabase non configuré : les données restent dans ce navigateur. Renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier pour activer la synchro.';
  document.body.appendChild(b);
}

(async function init(){
  await loadState();
  render();
  syncBadge();
})();
</script>
</body>
</html>
